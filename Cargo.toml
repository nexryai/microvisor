[package]
name = "microvisor"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A headless YAML-driven SELinux protection profile manager"
license = "MIT"
repository = "https://github.com/nexryai/microvisor"
default-run = "microvisor"

[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
tempfile = "3.20"
uuid = { version = "1.18", features = ["serde", "v4"] }

[[bin]]
name = "microvisor"
path = "src/main.rs"
