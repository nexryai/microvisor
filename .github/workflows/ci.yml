name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          dnf install -y \
            cargo rust rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Test CLI and policy generator
        run: cargo test --locked
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Check package layout
        run: |
          install_root="${RUNNER_TEMP}/microvisor-install"
          install -Dpm 0755 target/release/microvisor \
            "${install_root}/usr/bin/microvisor"
          install -Dpm 0644 data/microvisor.8 \
            "${install_root}/usr/share/man/man8/microvisor.8"
          install -d -m 0755 \
            "${install_root}/etc/microvisor/profiles.d"
          test -x "${install_root}/usr/bin/microvisor"
          test -f "${install_root}/usr/share/man/man8/microvisor.8"
          test -d "${install_root}/etc/microvisor/profiles.d"
