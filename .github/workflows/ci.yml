name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          dnf install -y \
            cargo cargo-rpm-macros clippy git-core make rpm-build rust rustfmt tar xz
      - name: Format
        run: cargo fmt --check
      - name: Test CLI and policy generator
        run: cargo test --locked
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Check package layout
        run: |
          install_root="${RUNNER_TEMP}/microvisor-install"
          install -Dpm 0755 target/release/microvisor \
            "${install_root}/usr/bin/microvisor"
          install -Dpm 0644 data/microvisor.8 \
            "${install_root}/usr/share/man/man8/microvisor.8"
          install -Dpm 0600 data/microvisor.yml \
            "${install_root}/etc/microvisor.yml"
          test -x "${install_root}/usr/bin/microvisor"
          test -f "${install_root}/usr/share/man/man8/microvisor.8"
          test -f "${install_root}/etc/microvisor.yml"
          test "$(stat -c %a "${install_root}/etc/microvisor.yml")" = 600
      - name: Build COPR source RPM
        run: |
          srpm_directory="${RUNNER_TEMP}/microvisor-srpm"
          make -f .copr/Makefile srpm \
            outdir="${srpm_directory}" \
            spec=microvisor.spec
          mapfile -t srpms < <(find "${srpm_directory}" -maxdepth 1 -type f -name '*.src.rpm')
          test "${#srpms[@]}" -eq 1
          package_name=$(rpm -qp --qf '%{NAME}' "${srpms[0]}")
          package_version=$(rpm -qp --qf '%{VERSION}' "${srpms[0]}")
          rpm -qpl "${srpms[0]}" | grep -Fx \
            "${package_name}-${package_version}.tar.xz"
          rpm -qpl "${srpms[0]}" | grep -Fx \
            "${package_name}-${package_version}-vendor.tar.xz"
          rpm -qpl "${srpms[0]}" | grep -Fx microvisor.spec
