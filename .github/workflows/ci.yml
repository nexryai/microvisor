name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          dnf install -y \
            cargo rust rustfmt clippy meson ninja-build
      - name: Format
        run: cargo fmt --check
      - name: Test CLI and policy generator
        run: cargo test --locked
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build package layout
        run: |
          meson setup build
          meson compile -C build
