<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Microvisor</title>
  <desc>A rounded yellow shield with a protected data aperture.</desc>
  <!-- 128×128 GNOME app icon, aligned to a 2 px construction grid. -->
  <!-- The dark lower profile adds depth without casting a shadow outside the silhouette. -->
  <path d="M64 10C78 20 92 24 106 26v38c0 26-14 44-42 56C36 108 22 90 22 64V26c14-2 28-6 42-16Z" fill="#c88800"/>
  <path d="M64 10C78 20 92 24 106 26v34c0 24-14 42-42 54C36 102 22 84 22 60V26c14-2 28-6 42-16Z" fill="#f6d32d"/>
  <!-- A broad highlight gives the curved face the softly modelled GNOME app-icon look. -->
  <path d="M64 16C76 24 88 28 100 30v10C88 38 76 34 64 26 52 34 40 38 28 40V30c12-2 24-6 36-14Z" fill="#f9f06b"/>
  <path d="M28 40v18c0 22 12 38 36 50 24-12 36-28 36-50V40c-12-2-24-6-36-14-12 8-24 12-36 14Z" fill="#f8e45c" opacity=".42"/>
  <!-- The recessed visor is deliberately bold enough to remain legible at 32 px. -->
  <path d="M42 58c6-10 38-10 44 0-6 16-38 16-44 0Z" fill="#9a6700"/>
  <rect x="52" y="56" width="24" height="8" rx="4" fill="#fff"/>
  <path d="M36 92c6 8 16 14 28 20 12-6 22-12 28-20-6 10-16 18-28 24-12-6-22-14-28-24Z" fill="#e5a50a"/>
</svg>
